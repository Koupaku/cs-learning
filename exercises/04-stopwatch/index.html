<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>秒表</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      max-width: 360px;
      margin: 80px auto;
      text-align: center;
    }
    #display {
      font-size: 56px;
      font-weight: bold;
      margin: 24px 0;
    }
    button {
      font-size: 16px;
      padding: 10px 24px;
      margin: 0 4px;
      border: none;
      border-radius: 6px;
      background: #4a90d9;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>⏱️ 秒表</h1>
  <div id="display">0.0 秒</div>
  <button id="startBtn">开始</button>
  <button id="pauseBtn">暂停</button>
  <button id="resetBtn">重置</button>
  <script src="app.js"></script>
</body>
</html>
