<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>天气卡片（模块化版）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 练习 09：天气卡片模块化
       注意：script 用了 type="module"，src 指向 js/main.js
       运行方式：右键本文件 → Open with Live Server（不能双击！） -->

  <main class="card">
    <h1>🌤️ 天气卡片</h1>

    <div class="city-btns">
      <button class="city-btn" data-city="北京">北京</button>
      <button class="city-btn" data-city="上海">上海</button>
      <button class="city-btn" data-city="广州">广州</button>
      <button class="city-btn" data-city="深圳">深圳</button>
    </div>

    <div class="weather-info">
      <div class="weather-emoji" id="weatherEmoji">--</div>
      <div class="city-name" id="cityName">选择城市</div>
      <div class="temp" id="temp">--</div>
      <div class="wind" id="wind"></div>
    </div>

    <div class="status" id="status"></div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
