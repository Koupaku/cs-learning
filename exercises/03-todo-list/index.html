<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>待办清单 Todo List</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      max-width: 420px;
      margin: 60px auto;
    }
    h1 { text-align: center; }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #todoInput {
      flex: 1;
      font-size: 16px;
      padding: 8px 12px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }
    button {
      font-size: 15px;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #4a90d9;
      color: white;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: #f5f5f5;
      border-radius: 6px;
    }
    li.done span { text-decoration: line-through; color: #999; }
    li button {
      background: #e05d5d;
      padding: 4px 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>📝 待办清单</h1>
  <div class="input-row">
    <input id="todoInput" type="text" placeholder="要做什么？">
    <button id="addBtn">添加</button>
  </div>
  <ul id="todoList"></ul>

  <script src="app.js"></script>
</body>
</html>
